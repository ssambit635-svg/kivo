name: Android APK

# Why this workflow exists
# ------------------------
# frontend/kivo.apk used to be assembled by a hand-written Python script (binary
# manifest, hand-built resources.arsc, hand-emitted DEX, hand-rolled v1+v2
# signing). It unzipped cleanly and passed a lenient parser, but its resource
# table had ZERO entries, so the manifest's android:icon reference (0x7f020000)
# resolved to nothing and Android rejected the package with "There was a problem
# parsing the package". You cannot hand-build a package that survives a modern
# PackageInstaller, so the APK is now built by the real toolchain
# (AAPT2 + javac + D8 + apksig) here, verified twice, and published three ways:
#
#   1. workflow artifact `kivo-apk`
#   2. the rolling `apk-latest` GitHub release
#   3. committed straight back into the branch as frontend/kivo.apk, so the
#      in-app "Download App (APK)" button (/download/apk) serves a package that
#      installs — and so a failed build leaves android/BUILD_REPORT.md behind
#      with the compiler output instead of a red X nobody can read.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach the APK to the rolling "apk-latest" release'
        type: boolean
        default: true

permissions:
  contents: write   # publish the release + push the APK and the build report back

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  HAS_KEYSTORE_SECRET: ${{ secrets.KIVO_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    name: Build, sign and verify kivo.apk
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preflight — every resource reference resolves
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 android/tools/verify_resources.py 2>&1 | tee dist/preflight.log

      - name: Install the Android SDK packages this build needs
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi

          SDKMANAGER=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager on this runner — installing the command-line tools."
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore the CI signing key
        if: env.HAS_KEYSTORE_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: android/ci-signing
          key: kivo-ci-signing-key-v1

      - name: Prepare the signing key
        run: |
          set -euo pipefail
          KEYDIR="$GITHUB_WORKSPACE/android/ci-signing"
          PROPS="$GITHUB_WORKSPACE/android/keystore.properties"
          mkdir -p "$KEYDIR"

          if [ "${HAS_KEYSTORE_SECRET:-false}" = "true" ]; then
            echo "Using the release keystore from repository secrets."
            printf '%s' "$KIVO_KEYSTORE_BASE64" | base64 --decode > "$KEYDIR/release.keystore"
            STORE_FILE="$KEYDIR/release.keystore"
            STORE_PASS="$KIVO_KEYSTORE_PASSWORD"
            KEY_ALIAS="${KIVO_KEY_ALIAS:-kivo}"
            KEY_PASS="${KIVO_KEY_PASSWORD:-$KIVO_KEYSTORE_PASSWORD}"
          elif [ -f "$KEYDIR/ci.keystore" ]; then
            echo "Reusing the cached CI keystore so an update installs over the previous build."
            STORE_FILE="$KEYDIR/ci.keystore"
            STORE_PASS="kivo-ci-only"
            KEY_ALIAS="kivo"
            KEY_PASS="kivo-ci-only"
          else
            echo "Generating a throwaway CI keystore (no signing secrets configured)."
            STORE_FILE="$KEYDIR/ci.keystore"
            STORE_PASS="kivo-ci-only"
            KEY_ALIAS="kivo"
            KEY_PASS="kivo-ci-only"
            keytool -genkeypair \
              -keystore "$STORE_FILE" -storetype PKCS12 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=kivo CI build, OU=kivo, O=kivo, C=IN" > /dev/null
          fi

          {
            echo "storeFile=$STORE_FILE"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > "$PROPS"

          echo "Signing key fingerprint:"
          keytool -list -v -keystore "$STORE_FILE" -storepass "$STORE_PASS" 2>/dev/null \
            | grep -E "Alias name|SHA256:" | tee dist/key.log || true
        env:
          KIVO_KEYSTORE_BASE64: ${{ secrets.KIVO_KEYSTORE_BASE64 }}
          KIVO_KEYSTORE_PASSWORD: ${{ secrets.KIVO_KEYSTORE_PASSWORD }}
          KIVO_KEY_ALIAS: ${{ secrets.KIVO_KEY_ALIAS }}
          KIVO_KEY_PASSWORD: ${{ secrets.KIVO_KEY_PASSWORD }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the release APK
        working-directory: android
        run: |
          set -euo pipefail
          # versionCode grows with the clock so a new build always installs over
          # the previous one instead of being rejected as a downgrade.
          VERSION_CODE="$(date -u +%y%m%d%H)"
          VERSION_NAME="1.1.$(date -u +%y%m%d)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          gradle --stacktrace \
            -PkivoVersionCode="$VERSION_CODE" \
            -PkivoVersionName="$VERSION_NAME" \
            :app:assembleRelease 2>&1 | tee ../dist/build.log

      - name: Verify the package with the official tools
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" dist/kivo.apk

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BUILD_TOOLS"

          echo "----- apksigner verify -----"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/kivo.apk | tee dist/apksigner.txt

          echo "----- aapt2 dump badging -----"
          "$BUILD_TOOLS/aapt2" dump badging dist/kivo.apk | tee dist/badging.txt

          echo "----- hard assertions -----"
          grep -Eq "Verified using v1 scheme.*: true" dist/apksigner.txt
          grep -Eq "Verified using v2 scheme.*: true" dist/apksigner.txt
          grep -q "Number of signers: 1" dist/apksigner.txt
          grep -q "package: name='ai.kivo.app'" dist/badging.txt
          grep -q "sdkVersion:'24'" dist/badging.txt
          grep -q "targetSdkVersion:'34'" dist/badging.txt
          grep -q "launchable-activity: name='ai.kivo.app.MainActivity'" dist/badging.txt
          grep -q "application-icon-" dist/badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" dist/badging.txt
          grep -q "uses-permission: name='android.permission.CAMERA'" dist/badging.txt
          echo "apksigner + aapt2 assertions passed."

      - name: Verify the package independently (androguard)
        run: |
          set -uo pipefail
          # A second opinion from a different implementation than apksigner: this
          # is the check that catches an unresolvable android:icon, the exact
          # failure that produced "There was a problem parsing the package".
          if python3 -m venv /tmp/apkverify >/dev/null 2>&1; then
            /tmp/apkverify/bin/pip install --quiet --disable-pip-version-check androguard \
              || echo "::warning::androguard could not be installed — structural checks only"
          fi
          PY=python3
          if [ -x /tmp/apkverify/bin/python ]; then PY=/tmp/apkverify/bin/python; fi
          "$PY" android/tools/verify_apk.py dist/kivo.apk 2>&1 | tee dist/verify.log

      - name: Build summary
        if: always()
        run: |
          {
            echo "### kivo.apk — built, signed and verified"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`ai.kivo.app\` |"
            echo "| versionName | \`${VERSION_NAME:-unknown}\` |"
            echo "| versionCode | \`${VERSION_CODE:-0}\` |"
            echo "| minSdk / targetSdk | 24 (Android 7.0) / 34 (Android 14) |"
            APK_SIZE="$(du -h dist/kivo.apk 2>/dev/null | cut -f1)"
            APK_SHA="$(sha256sum dist/kivo.apk 2>/dev/null | cut -d' ' -f1)"
            echo "| size | ${APK_SIZE:-not built} |"
            echo "| sha256 | \`${APK_SHA:-not built}\` |"
            echo
            echo "**Install:** download the \`kivo-apk\` artifact below (or take"
            echo "\`frontend/kivo.apk\`, which this workflow pushes back to the branch)."
            echo "On first launch the app asks for the server address — start the backend"
            echo "(\`cd backend && npm start\`) and type the computer's LAN address, e.g."
            echo "\`http://192.168.1.7:8080\`."
            echo
            echo "<details><summary>apksigner verification</summary>"
            echo
            echo '```'
            cat dist/apksigner.txt 2>/dev/null || echo '(not produced)'
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>aapt2 badging</summary>"
            echo
            echo '```'
            head -40 dist/badging.txt 2>/dev/null || echo '(not produced)'
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kivo-apk
          path: |
            dist/kivo.apk
            dist/apksigner.txt
            dist/badging.txt
            dist/verify.log
            dist/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to the rolling "apk-latest" release
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          NOTES="kivo Android APK — built by GitHub Actions from commit ${GITHUB_SHA::7}.

          package: ai.kivo.app · versionName ${VERSION_NAME:-1.1.x} · versionCode ${VERSION_CODE:-0}
          minSdk 24 (Android 7.0) · targetSdk 34 (Android 14) · signed v1+v2

          Install: download kivo.apk, open it on the phone, allow \"install unknown apps\".
          First launch asks for the server address (cd backend && npm start, then type the
          computer's LAN address, e.g. http://192.168.1.7:8080)."

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "kivo.apk (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/kivo.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # ------------------------------------------------------------------
      # Push the result back into git. Artifacts are the normal channel, but a
      # build report in the repo is what makes a failure debuggable from
      # anywhere, and frontend/kivo.apk is what the backend actually serves at
      # /download/apk. Committed with [skip ci] so this never loops.
      # ------------------------------------------------------------------
      - name: Collect the build report
        if: always()
        run: |
          set -uo pipefail
          {
            echo "# Android build report"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo "| event | $GITHUB_EVENT_NAME |"
            echo "| ref | $GITHUB_REF |"
            echo "| commit | ${GITHUB_SHA} |"
            echo "| versionName | ${VERSION_NAME:-unknown} |"
            echo "| versionCode | ${VERSION_CODE:-0} |"
            echo "| APK sha256 | $(sha256sum dist/kivo.apk 2>/dev/null | cut -d' ' -f1 || echo 'not built') |"
            echo "| APK size | $(stat -c %s dist/kivo.apk 2>/dev/null || echo 'not built') bytes |"
            echo
            echo "Generated by \`.github/workflows/android.yml\`. Do not edit by hand."
            echo
            if [ -f dist/key.log ]; then
              echo "## Signing key"
              echo
              echo '```'
              cat dist/key.log
              echo '```'
              echo
            fi
            if [ -f dist/apksigner.txt ]; then
              echo "## apksigner verify"
              echo
              echo '```'
              cat dist/apksigner.txt
              echo '```'
              echo
            fi
            if [ -f dist/badging.txt ]; then
              echo "## aapt2 dump badging"
              echo
              echo '```'
              cat dist/badging.txt
              echo '```'
              echo
            fi
            if [ -f dist/verify.log ]; then
              echo "## verify_apk.py (independent check)"
              echo
              echo '```'
              cat dist/verify.log
              echo '```'
              echo
            fi
            if [ -f dist/build.log ]; then
              echo "## compiler / tool errors (with context)"
              echo
              echo '```'
              grep -n -B 2 -A 8 -E "error:|FAILURE:|What went wrong|Execution failed|Caused by:|AAPT|aapt2|Note:|\* Where" dist/build.log \
                | head -200 || true
              echo '```'
              echo
              echo "## task log (tail)"
              echo
              echo '```'
              tail -60 dist/build.log
              echo '```'
            else
              echo "## gradle output"
              echo
              echo "The build step never produced output — an earlier step failed."
            fi
          } > dist/BUILD_REPORT.md
          echo "report written: $(wc -l < dist/BUILD_REPORT.md) lines"

      - name: Push the APK and the build report back to the branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$BRANCH" ]; then
            echo "No branch to push to (detached ref) — skipping."
            exit 0
          fi
          WORK="$(mktemp -d)"
          if ! git clone --quiet --depth 1 --branch "$BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"; then
            echo "::warning::could not clone $BRANCH to publish the build"
            exit 0
          fi

          cp dist/BUILD_REPORT.md "$WORK/android/BUILD_REPORT.md"
          if [ -f dist/kivo.apk ] && [ -s dist/kivo.apk ] \
             && grep -q "\[verify\] PASSED" dist/verify.log 2>/dev/null; then
            cp dist/kivo.apk "$WORK/frontend/kivo.apk"
            echo "Including the verified APK in the commit."
          else
            echo "Not committing an APK (build failed or verification did not pass)."
          fi

          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/BUILD_REPORT.md frontend/kivo.apk
          if git diff --cached --quiet; then
            echo "Nothing changed — the branch already has this build."
            exit 0
          fi
          STATUS="failed"
          if [ -f dist/kivo.apk ] && grep -q "\[verify\] PASSED" dist/verify.log 2>/dev/null; then
            STATUS="verified"
          fi
          git commit --quiet -m "chore(android): ${STATUS} APK build report from CI [skip ci]"
          if git push --quiet origin "HEAD:${BRANCH}"; then
            echo "Pushed to ${BRANCH}."
          else
            echo "::warning::could not push the build report to ${BRANCH}"
          fi
