name: CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test

jobs:
  backend:
    name: Backend tests + automated security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify frontend assets exist (fast fail)
        run: |
          set -e
          test -f ../frontend/index.html
          test -f ../frontend/app.js
          test -f ../frontend/care.js
          test -f ../frontend/doctor/index.html
          test -f ../frontend/landing/index.html
          test -f ../frontend/kivo.apk
          echo "frontend assets OK"
          ls -lh ../frontend/kivo.apk

      - name: Full unit + integration suite (600 tests)
        run: npm test
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

      - name: Clinical knowledge invariants
        run: npm run knowledge:verify

      - name: Secret & credential scan
        run: npm run security:scan

      - name: Security posture (headers, CORS, monitor)
        run: npm run security:headers

      - name: Dependency advisory gate (high / critical)
        # This gate talks to registry.npmjs.org. Network blips must not red main.
        # The script itself retries 3x and warns+passes on outage; --strict would fail.
        # We run without --strict so an advisory-service outage never blocks CI.
        run: npm run security:deps
        continue-on-error: false

      - name: End-to-end endpoint smoke test (126 checks)
        run: npm run smoke
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning

      - name: APK package sanity (installable check)
        if: always()
        run: |
          set -e
          if [ -f ../frontend/kivo.apk ]; then
            echo "APK exists: $(stat -c %s ../frontend/kivo.apk) bytes"
            # quick container sanity - must be a zip
            unzip -l ../frontend/kivo.apk | head -20
          else
            echo "WARN: frontend/kivo.apk missing - apk-package.test.js would have failed"
          fi

  browser:
    name: Mobile login and feature journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests (with 2 retries in CI)
        run: npm run test:browser
        env:
          PLAYWRIGHT_RETRIES: 2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            backend/playwright-report/
            backend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Keep the pipeline green even if advisory service is down:
  # This job only runs if the two above succeed or are skipped, and it always passes
  # so the overall workflow status reflects real code health, not third-party outages.
  ci-status:
    name: CI status (all checks)
    runs-on: ubuntu-latest
    needs: [backend, browser]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "backend: ${{ needs.backend.result }}"
          echo "browser: ${{ needs.browser.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] && [ "${{ needs.backend.result }}" != "skipped" ]; then
            echo "Backend job failed"
            exit 1
          fi
          if [ "${{ needs.browser.result }}" != "success" ] && [ "${{ needs.browser.result }}" != "skipped" ]; then
            echo "Browser job failed"
            exit 1
          fi
          echo "All CI checks passed"
