name: CI & Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + automated security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full unit + integration suite
        run: npm test

      - name: Clinical knowledge invariants
        run: npm run knowledge:verify

      - name: Secret & credential scan
        run: npm run security:scan

      - name: Security posture (headers, CORS, monitor)
        run: npm run security:headers

      - name: Dependency advisory gate (high / critical)
        run: npm run security:deps

      - name: End-to-end endpoint smoke test
        run: npm run smoke

  browser:
    name: Mobile login and feature journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
