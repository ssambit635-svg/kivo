name: CI & Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + automated security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full unit + integration suite
        run: npm test

      - name: Clinical knowledge invariants
        run: npm run knowledge:verify

      - name: Secret & credential scan
        run: npm run security:scan

      - name: Security posture (headers, CORS, monitor)
        run: npm run security:headers

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: End-to-end endpoint smoke test
        run: npm run smoke
