# Gradle/AGP settings for the kivo Android shell.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AGP 8 defaults. The project has no AndroidX dependencies at all (the shell is
# plain android.app.Activity + android.webkit), these are set so AGP never has
# to guess and so the R class stays non-transitive.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep resource paths readable inside the APK. AGP's release optimizer renames
# res/mipmap-hdpi/ic_launcher.png to res/BW.png and res/layout/activity_main.xml
# to res/BW.xml to save ~1% of the package; on a 67 KB shell that trade buys
# nothing and costs a lot — `aapt2 dump badging` prints icon='res/BW.xml', and
# anyone opening the APK (or the CI report) cannot tell a launcher icon from a
# layout. android.enableResourceOptimizations is deprecated and goes away in AGP
# 9, which is why tools/verify_apk.py and the backend package test assert the
# resource *table* rather than these paths: they pass either way.
android.enableResourceOptimizations=false
